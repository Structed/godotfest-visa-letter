name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish -c Release -o dist

      - name: Point base href at the project page
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|g' \
            dist/wwwroot/index.html

      - name: Add Pages support files
        run: |
          touch dist/wwwroot/.nojekyll
          cp dist/wwwroot/index.html dist/wwwroot/404.html

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/wwwroot
          include-hidden-files: true

      - name: Upload Pages artifact
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wwwroot

  # Runs only once Pages is enabled and the ENABLE_PAGES repository variable is set to
  # 'true'. Pages on a private repository requires a paid GitHub plan.
  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
