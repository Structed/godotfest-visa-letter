name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deployment at a time: queued runs collapse to the latest, but a deploy that
# is already under way is allowed to finish. Pull request builds are per-ref and supersede
# each other, and never reach the deploy job.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish -c Release -o dist

      # A project Pages site is served from /<repo>/, not /. If this rewrite silently missed,
      # the deployed site would ask for its framework files at the domain root and never
      # boot, so the grep turns that into a build failure rather than a broken deployment.
      - name: Point base href at the project page
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"[^\"]*\"|<base href=\"$base\"|" dist/wwwroot/index.html
          grep -q "<base href=\"$base\"" dist/wwwroot/index.html

      - name: Add Pages support files
        run: |
          touch dist/wwwroot/.nojekyll
          cp dist/wwwroot/index.html dist/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wwwroot

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
